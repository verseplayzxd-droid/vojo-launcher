// Resolve dependency metadata only; this does not change application dependencies.
gradle.beforeProject { app ->
    if (app.path != ':app_pojavlauncher') return
    app.tasks.register('verifyAuthDependencyScopes') {
        doLast {
            def modules = { config ->
                config.incoming.resolutionResult.allComponents.collect { it.id }
                    .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            }
            ['debugRuntimeClasspath', 'releaseRuntimeClasspath'].each { name ->
                def ids = modules(app.configurations.getByName(name))
                if (ids.any { it.group == 'junit' || it.group == 'org.hamcrest' }) {
                    throw new GradleException("Test framework resolved on application runtime: ${name}")
                }
                println "PASS ${name}: JUnit and Hamcrest absent"
            }
            def tests = app.configurations.findAll {
                it.canBeResolved && it.name.toLowerCase().startsWith('debug') &&
                    it.name.toLowerCase().contains('unittest') && it.name.endsWith('RuntimeClasspath')
            }
            if (tests.size() != 1) throw new GradleException('Expected exactly one debug unit-test runtime configuration')
            def ids = modules(tests.first())
            if (!ids.any { it.group == 'junit' && it.module == 'junit' && it.version == '4.13.2' }) {
                throw new GradleException('Approved JUnit 4.13.2 did not resolve on the unit-test runtime')
            }
            println "PASS ${tests.first().name}: JUnit 4.13.2 is test-only"
            ids.findAll { it.group == 'junit' || it.group == 'org.hamcrest' }.each { println "Test-only: ${it}" }
        }
    }
}
